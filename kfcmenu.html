            .share-text { font-weight: 500; font-size: 16px; }
            .loading-spinner { text-align: center; padding: 50px; color: #8B0000; }
            .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #8B0000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            .error-message { text-align: center; padding: 50px; color: #dc3545; background: white; border-radius: 16px; margin: 20px; }
            .star { position: absolute; color: white; font-size: 12px; opacity: 0; pointer-events: none; z-index: 9999; }
      </style>
</head>

<body>
      <!-- Top Navigation Bar -->
      <nav class="navbar" id="navbar">
            <button class="nav-btn" id="backButton"><i class="fas fa-arrow-left"></i></button>
            <div class="nav-title">KFC</div>
            <div style="display: flex; gap: 12px;">
                  <button class="nav-btn" id="searchButton"><i class="fas fa-search"></i></button>
                  <button class="nav-btn" id="shareButton"><i class="fas fa-share-alt"></i></button>
            </div>
      </nav>

      <!-- Hero Image -->
      <div class="hero-section">
            <img src="https://img.cdn4dd.com/cdn-cgi/image/fit=cover,width=600,height=400,format=auto,quality=80/https://doordash-static.s3.amazonaws.com/media/store/header/8ff99d61-2170-4ff4-bbd2-55370c49ba3d.png" alt="KFC Storefront" class="hero-image">
            <div class="hero-overlay">
                  <h1 class="hero-title">KFC Delivery Menu</h1>
                  <p class="hero-subtitle">Order KFC crispy chicken in Marrakech! Enjoy fresh chicken meals, burgers, sides and drinks. Fast delivery to your door.</p>
            </div>
      </div>

      <!-- Restaurant Info -->
      <div class="restaurant-info">
            <h1 class="restaurant-name">KFC Delivery Marrakech</h1>
            <div class="rating-delivery">
                  <div class="delivery-time"><i class="fas fa-motorcycle delivery-icon"></i><span>25-35 min</span></div>
            </div>
      </div>

      <!-- Categories Section -->
      <div class="categories-section" id="categoriesSection">
            <div class="categories" id="categoriesContainer"></div>
      </div>

      <!-- Sections Container -->
      <div id="sectionsContainer">
            <div class="loading-spinner"><div class="spinner"></div><p>Loading menu from Firebase...</p></div>
      </div>

      <!-- View Cart Button -->
      <button class="view-cart-btn" id="viewCartBtn" style="display: none;">
            <span>View Basket</span>
            <div class="cart-item-count" id="cartItemCount">0</div>
      </button>

      <!-- Overlay & Modal Container -->
      <div class="overlay" id="modalOverlay"></div>

      <!-- Search Modal -->
      <div class="overlay" id="searchOverlay" style="display: none;">
            <div class="search-modal">
                  <div class="search-header">
                        <div class="search-input-container"><i class="fas fa-search"></i><input type="text" class="search-input" id="searchInput" placeholder="Search KFC meals..."></div>
                        <div class="close-btn" id="closeSearchBtn"><i class="fas fa-times"></i></div>
                  </div>
                  <div class="search-results" id="searchResults"><div class="no-results">Type to start searching</div></div>
            </div>
      </div>

      <!-- Share Modal -->
      <div class="overlay" id="shareOverlay" style="display: none;">
            <div class="share-modal">
                  <div class="modal-header"><div class="modal-title">Share Order</div><div class="close-btn" id="closeShareBtn"><i class="fas fa-times"></i></div></div>
                  <div class="share-options">
                        <div class="share-option" id="whatsappShare"><div class="share-icon"><i class="fab fa-whatsapp"></i></div><div class="share-text">Share via WhatsApp</div></div>
                        <div class="share-option" id="copyShare"><div class="share-icon"><i class="fas fa-copy"></i></div><div class="share-text">Copy Order Details</div></div>
                  </div>
            </div>
      </div>

      <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

      <script>
            // ==================== Firebase Configuration ====================
            const firebaseConfig = {
                  apiKey: "AIzaSyC7BQcsjKxZq0jATJ14wXoruOIa8NiIQsE",
                  authDomain: "kfc-menu-dashboard.firebaseapp.com",
                  databaseURL: "https://kfc-menu-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
                  projectId: "kfc-menu-dashboard",
                  storageBucket: "kfc-menu-dashboard.firebasestorage.app",
                  messagingSenderId: "465768808759",
                  appId: "1:465768808759:web:d2ab65440b19008e465ab2"
            };

            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            // ==================== Global Variables ====================
            let allProducts = { chickenMeals: [], hotWings: [], loadedBuckets: [], comboMeals: [], familyBuckets: [], sides: [], drinks: [] };
            let cart = JSON.parse(localStorage.getItem('kfcCart')) || [];
            let currentProduct = null;
            let lastClickedAddRect = null;

            const categoryNames = { chickenMeals: "CHICKEN MEALS", hotWings: "HOT WINGS", loadedBuckets: "LOADED BUCKETS", comboMeals: "COMBO MEALS", familyBuckets: "FAMILY BUCKETS", sides: "SIDES", drinks: "DRINKS" };
            const categoryOrder = ["chickenMeals", "hotWings", "loadedBuckets", "comboMeals", "familyBuckets", "sides", "drinks"];

            function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
            function ensureArray(data) { if (!data) return []; if (Array.isArray(data)) return data; if (typeof data === 'object') return Object.values(data); return []; }

            // ==================== Load Products from Firebase ====================
            function loadProducts() {
                  const container = document.getElementById('sectionsContainer');
                  container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Loading menu from Firebase...</p></div>';
                  
                  database.ref('products').once('value').then(snapshot => {
                        const data = snapshot.val();
                        if (data && Object.keys(data).length > 0) {
                              Object.keys(categoryNames).forEach(catKey => { allProducts[catKey] = ensureArray(data[catKey]); });
                              renderCategories();
                              renderAllSections();
                        } else {
                              container.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle" style="font-size: 48px; margin-bottom: 15px;"></i><h3>No products found!</h3><p>Please add products from the admin dashboard first.</p></div>`;
                        }
                        updateCartUI();
                  }).catch(error => {
                        container.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle" style="font-size: 48px; margin-bottom: 15px;"></i><h3>Error loading menu!</h3><p>${error.message}</p></div>`;
                  });
            }

            // ==================== Render Categories ====================
            function renderCategories() {
                  const categoriesContainer = document.getElementById('categoriesContainer');
                  categoriesContainer.innerHTML = '';
                  categoryOrder.forEach(catKey => {
                        if (allProducts[catKey] && allProducts[catKey].length > 0) {
                              const categoryDiv = document.createElement('div');
                              categoryDiv.className = 'category';
                              if (catKey === 'chickenMeals') categoryDiv.classList.add('active');
                              categoryDiv.setAttribute('data-category', catKey);
                              categoryDiv.textContent = categoryNames[catKey];
                              categoriesContainer.appendChild(categoryDiv);
                        }
                  });
                  document.querySelectorAll('.category').forEach(cat => {
                        cat.addEventListener('click', function() {
                              const section = document.getElementById(`${this.getAttribute('data-category')}Section`);
                              if (section) section.scrollIntoView({ behavior: 'smooth' });
                        });
                  });
            }

            // ==================== Render Products ====================
            function renderAllSections() {
                  const container = document.getElementById('sectionsContainer');
                  container.innerHTML = '';
                  let hasAnyProducts = false;
                  
                  categoryOrder.forEach(catKey => {
                        let products = allProducts[catKey] || [];
                        if (!Array.isArray(products)) products = ensureArray(products);
                        if (products.length === 0) return;
                        hasAnyProducts = true;
                        const section = document.createElement('div');
                        section.className = 'category-items-section animate-section';
                        section.id = `${catKey}Section`;
                        const title = document.createElement('h2');
                        title.className = 'section-title';
                        title.textContent = categoryNames[catKey];
                        section.appendChild(title);
                        products.forEach(product => {
                              if (product && typeof product === 'object') {
                                    const item = document.createElement('div');
                                    item.className = 'category-item';
                                    const productImage = product.image && product.image !== '' ? product.image : 'https://via.placeholder.com/100x100/8B0000/white?text=KFC';
                                    item.innerHTML = `
                                          <img src="${productImage}" class="item-image" onerror="this.src='https://via.placeholder.com/100x100/8B0000/white?text=No+Img'">
                                          <div class="item-info">
                                                <div class="item-name">${escapeHtml(product.name)}</div>
                                                <div class="item-description">${escapeHtml(product.description || 'Delicious KFC meal')}</div>
                                                <div class="item-footer">
                                                      <div class="item-price"><div class="price-size"><span class="price-amount">${(product.price || 0).toFixed(2)} MAD</span></div></div>
                                                      <button class="item-add-btn" data-name="${escapeHtml(product.name)}" data-product='${JSON.stringify(product)}'>+</button>
                                                </div>
                                          </div>
                                    `;
                                    section.appendChild(item);
                              }
                        });
                        container.appendChild(section);
                  });
                  
                  if (!hasAnyProducts) {
                        container.innerHTML = `<div class="error-message"><i class="fas fa-box-open" style="font-size: 48px; margin-bottom: 15px;"></i><h3>No products available</h3><p>Please add products from the admin dashboard.</p></div>`;
                  } else {
                        attachAddToCartEvents();
                        setupIntersectionObserver();
                  }
            }

            function attachAddToCartEvents() {
                  document.querySelectorAll('.item-add-btn').forEach(btn => {
                        btn.removeEventListener('click', handleAddClick);
                        btn.addEventListener('click', handleAddClick);
                  });
            }

            function handleAddClick(e) {
                  const btn = e.currentTarget;
                  const product = JSON.parse(btn.getAttribute('data-product'));
                  const rect = btn.getBoundingClientRect();
                  lastClickedAddRect = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
                  
                  if (product.hasFlavours || product.hasDrinks || (product.hasExtras && product.extras?.length > 0) || product.totalPieces) {
                        openCustomizationModal(product);
                  } else {
                        addToCart(product, 1, {}, "");
                  }
            }

            // ==================== Cart Functions ====================
            function addToCart(product, quantity, customizations, specialInstructions) {
                  const existingIndex = cart.findIndex(item => item.id === product.id && JSON.stringify(item.customizations) === JSON.stringify(customizations));
                  let total = (product.price || 0) * quantity;
                  if (customizations.extras) {
                        Object.values(customizations.extras).forEach(extra => { total += (extra.price || 0) * (extra.quantity || 1); });
                  }
                  
                  if (existingIndex !== -1) {
                        cart[existingIndex].quantity += quantity;
                        cart[existingIndex].totalPrice += total;
                  } else {
                        cart.push({ id: product.id, name: product.name, basePrice: product.price, quantity: quantity, totalPrice: total, img: product.image, description: product.description, customizations: customizations, specialInstructions: specialInstructions });
                  }
                  saveCart();
                  flyToBasket();
            }

            function flyToBasket() {
                  const viewCartBtn = document.getElementById('viewCartBtn');
                  if (!lastClickedAddRect || !viewCartBtn) return;
                  const cartRect = viewCartBtn.getBoundingClientRect();
                  const flyingEl = document.createElement('div');
                  flyingEl.className = 'flying-element';
                  flyingEl.style.left = (lastClickedAddRect.left + lastClickedAddRect.width / 2) + 'px';
                  flyingEl.style.top = (lastClickedAddRect.top + lastClickedAddRect.height / 2) + 'px';
                  flyingEl.style.transform = 'translate(-50%, -50%)';
                  document.body.appendChild(flyingEl);
                  setTimeout(() => {
                        flyingEl.style.transform = `translate(${cartRect.left - lastClickedAddRect.left}px, ${cartRect.top - lastClickedAddRect.top}px) scale(0.1)`;
                        flyingEl.style.opacity = '0';
                        setTimeout(() => flyingEl.remove(), 500);
                  }, 10);
                  setTimeout(() => createStarsAnimation(), 400);
                  lastClickedAddRect = null;
            }

            function createStarsAnimation() {
                  const viewCartBtn = document.getElementById('viewCartBtn');
                  if (!viewCartBtn) return;
                  for (let i = 0; i < 12; i++) {
                        const star = document.createElement('div');
                        star.classList.add('star');
                        star.innerHTML = '★';
                        star.style.position = 'fixed';
                        star.style.zIndex = '9999';
                        star.style.color = 'white';
                        star.style.fontSize = Math.floor(12 + Math.random() * 8) + 'px';
                        star.style.opacity = '0';
                        const rect = viewCartBtn.getBoundingClientRect();
                        const startX = rect.left + rect.width / 2;
                        const startY = rect.top + rect.height / 2;
                        star.style.left = startX + 'px';
                        star.style.top = startY + 'px';
                        const angle = Math.random() * Math.PI * 2;
                        const distance = 40 + Math.random() * 60;
                        const endX = startX + Math.cos(angle) * distance;
                        const endY = startY + Math.sin(angle) * distance;
                        document.body.appendChild(star);
                        star.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${endX - startX}px, ${endY - startY}px) scale(0)`, opacity: 0 }], { duration: 800 + Math.random() * 400, easing: 'cubic-bezier(0.175,0.885,0.32,1.275)' }).onfinish = () => star.remove();
                  }
            }

            function saveCart() { localStorage.setItem('kfcCart', JSON.stringify(cart)); updateCartUI(); }
            function updateCartUI() {
                  const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
                  const viewCartBtn = document.getElementById('viewCartBtn');
                  const cartItemCount = document.getElementById('cartItemCount');
                  if (itemCount > 0) { viewCartBtn.style.display = 'flex'; cartItemCount.textContent = itemCount; }
                  else { viewCartBtn.style.display = 'none'; }
            }

            // ==================== Intersection Observer ====================
            function setupIntersectionObserver() {
                  const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                              if (entry.isIntersecting) {
                                    entry.target.classList.add('visible');
                                    const categoryKey = entry.target.id.replace('Section', '');
                                    document.querySelectorAll('.category').forEach(cat => {
                                          if (cat.getAttribute('data-category') === categoryKey) {
                                                cat.classList.add('active');
                                                const container = document.getElementById('categoriesContainer');
                                                const catLeft = cat.offsetLeft;
                                                const containerWidth = container.offsetWidth;
                                                const catWidth = cat.offsetWidth;
                                                container.scrollTo({ left: catLeft - (containerWidth / 2) + (catWidth / 2), behavior: 'smooth' });
                                          } else { cat.classList.remove('active'); }
                                    });
                              }
                        });
                  }, { threshold: 0.1, rootMargin: '-80px 0px -50% 0px' });
                  document.querySelectorAll('.category-items-section').forEach(section => { observer.observe(section); });
            }

            // ==================== Search Functions ====================
            function setupSearch() {
                  const searchOverlay = document.getElementById('searchOverlay');
                  const searchInput = document.getElementById('searchInput');
                  const searchResults = document.getElementById('searchResults');
                  const closeSearchBtn = document.getElementById('closeSearchBtn');
                  
                  document.getElementById('searchButton').addEventListener('click', () => { searchOverlay.style.display = 'flex'; document.body.style.overflow = 'hidden'; searchInput.focus(); });
                  closeSearchBtn.addEventListener('click', () => { searchOverlay.style.display = 'none'; document.body.style.overflow = 'auto'; });
                  searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) { searchOverlay.style.display = 'none'; document.body.style.overflow = 'auto'; } });
                  
                  searchInput.addEventListener('input', (e) => {
                        const query = e.target.value.toLowerCase().trim();
                        if (query.length < 2) { searchResults.innerHTML = '<div class="no-results">Type at least 2 characters</div>'; return; }
                        const results = [];
                        Object.keys(allProducts).forEach(cat => {
                              if (allProducts[cat] && Array.isArray(allProducts[cat])) {
                                    allProducts[cat].forEach(product => { if (product.name && product.name.toLowerCase().includes(query)) results.push(product); });
                              }
                        });
                        if (results.length > 0) {
                              searchResults.innerHTML = results.map(product => `<div class="search-result-item" data-product='${JSON.stringify(product)}'><img src="${product.image || 'https://via.placeholder.com/60x60/8B0000/white?text=KFC'}" class="search-result-image" onerror="this.src='https://via.placeholder.com/60x60/8B0000/white?text=No+Img'"><div class="search-result-info"><div class="search-result-name">${escapeHtml(product.name)}</div><div class="search-result-price">${(product.price || 0).toFixed(2)} MAD</div></div></div>`).join('');
                              document.querySelectorAll('.search-result-item').forEach(item => {
                                    item.addEventListener('click', () => {
                                          const product = JSON.parse(item.getAttribute('data-product'));
                                          const rect = item.getBoundingClientRect();
                                          lastClickedAddRect = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
                                          if (product.hasFlavours || product.hasDrinks || (product.hasExtras && product.extras?.length > 0) || product.totalPieces) { openCustomizationModal(product); }
                                          else { addToCart(product, 1, {}, ""); }
                                          searchOverlay.style.display = 'none';
                                          document.body.style.overflow = 'auto';
                                    });
                              });
                        } else { searchResults.innerHTML = '<div class="no-results">No results found</div>'; }
                  });
            }

            // ==================== Share Functions ====================
            function setupShare() {
                  const shareOverlay = document.getElementById('shareOverlay');
                  const closeShareBtn = document.getElementById('closeShareBtn');
                  document.getElementById('shareButton').addEventListener('click', () => { shareOverlay.style.display = 'flex'; document.body.style.overflow = 'hidden'; });
                  closeShareBtn.addEventListener('click', () => { shareOverlay.style.display = 'none'; document.body.style.overflow = 'auto'; });
                  shareOverlay.addEventListener('click', (e) => { if (e.target === shareOverlay) { shareOverlay.style.display = 'none'; document.body.style.overflow = 'auto'; } });
                  
                  document.getElementById('whatsappShare').addEventListener('click', () => {
                        if (cart.length === 0) { alert('Your cart is empty!'); return; }
                        let message = "🍗 *KFC Order Details* 🍗\n\n";
                        let total = 0;
                        cart.forEach(item => { message += `• ${item.name} x${item.quantity} = ${item.totalPrice.toFixed(2)} MAD\n`; total += item.totalPrice; });
                        message += `\n━━━━━━━━━━━━━━━━\n*Total: ${total.toFixed(2)} MAD*\n━━━━━━━━━━━━━━━━\nThank you for ordering from KFC! 🍗`;
                        window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
                        shareOverlay.style.display = 'none';
                        document.body.style.overflow = 'auto';
                  });
                  
                  document.getElementById('copyShare').addEventListener('click', () => {
                        if (cart.length === 0) { alert('Your cart is empty!'); return; }
                        let text = "KFC Order Details\n\n";
                        let total = 0;
                        cart.forEach(item => { text += `${item.name} x${item.quantity} = ${item.totalPrice.toFixed(2)} MAD\n`; total += item.totalPrice; });
                        text += `\nTotal: ${total.toFixed(2)} MAD\nThank you for ordering from KFC!`;
                        navigator.clipboard.writeText(text);
                        alert('Order details copied!');
                        shareOverlay.style.display = 'none';
                        document.body.style.overflow = 'auto';
                  });
            }

            // ==================== Main Customization Modal (الكود الأصلي من التصميم الثاني) ====================
            function openCustomizationModal(product) {
                  currentProduct = product;
                  
                  // بناء المودال بنفس الطريقة الأصلية من الكود الثاني
                  const modalHtml = `
                        <div class="modal">
                              <div class="modal-header">
                                    <div class="modal-title">Customize ${escapeHtml(product.name)}</div>
                                    <div class="close-btn" id="closeModalBtn"><i class="fas fa-times"></i></div>
                              </div>
                              <div class="modal-content">
                                    <img src="${product.image || 'https://via.placeholder.com/300x200/8B0000/white?text=KFC'}" class="modal-image" onerror="this.src='https://via.placeholder.com/300x200/8B0000/white?text=KFC'">
                                    <h2 class="modal-item-title">${escapeHtml(product.name)}</h2>
                                    <p class="modal-desc">${escapeHtml(product.description || '')}</p>
                                    ${product.totalPieces && product.flavours && product.flavours.length >= 2 ? `
                                    <div class="section-title-modal"><i class="fas fa-sliders-h"></i> Balance your flavours</div>
                                    <div class="flavour-balance">
                                          <div class="flavour-labels">
                                                <div class="flavour-side"><img src="${product.flavours[0].image || 'https://via.placeholder.com/70x70'}" alt="${product.flavours[0].name}"><span>${product.flavours[0].name}</span><div class="quantity" id="leftQtyDisplay">${Math.floor(product.totalPieces / 2)}</div><span class="pieces-label spicy">pieces ${product.flavours[0].name.toLowerCase()}</span></div>
                                                <div class="vs-divider">VS</div>
                                                <div class="flavour-side"><img src="${product.flavours[1].image || 'https://via.placeholder.com/70x70'}" alt="${product.flavours[1].name}"><span>${product.flavours[1].name}</span><div class="quantity" id="rightQtyDisplay">${Math.ceil(product.totalPieces / 2)}</div><span class="pieces-label original">pieces ${product.flavours[1].name.toLowerCase()}</span></div>
                                          </div>
                                          <div class="slider-container"><div class="slider-track" id="sliderTrack"></div><input type="range" id="flavourSlider" min="0" max="${product.totalPieces}" value="${Math.floor(product.totalPieces / 2)}"></div>
                                    </div>
                                    ` : ''}
                                    ${product.hasFlavours && product.flavours && product.flavours.length > 0 && !product.totalPieces ? `
                                    <div class="section-title-modal"><i class="fas fa-pepper-hot"></i> Choose Flavour</div>
                                    <div class="flavour-row">
                                          ${product.flavours.map((f, i) => `<div class="flavour-option ${i === 0 ? 'active' : ''}" data-flavour="${typeof f === 'string' ? f : f.name}">${typeof f === 'string' ? f : f.name}</div>${i < product.flavours.length - 1 ? '<span class="flavour-or">or</span>' : ''}`).join('')}
                                    </div>
                                    ` : ''}
                                    ${product.hasExtras && product.extras && product.extras.length > 0 ? `
                                    <div class="extra-heading"><i class="fas fa-plus-circle"></i> Add Extra + <span class="optional-text">(optional)</span></div>
                                    <div class="chicken-row">
                                          ${product.extras.map(extra => `
                                          <div class="chicken-card" data-extra-id="${extra.id}">
                                                <img src="${extra.image || 'https://via.placeholder.com/100x100'}" class="chicken-img" onerror="this.src='https://via.placeholder.com/100x100'">
                                                <div class="chicken-name">${escapeHtml(extra.name)}</div>
                                                <div class="chicken-subtotal" id="subtotal-${extra.id}">0.00 MAD</div>
                                                <div class="unit-hint">@ ${(extra.price || 0).toFixed(2)} MAD</div>
                                                <div class="item-counter">
                                                      <button class="counter-btn" onclick="window.updateExtraQuantity('${extra.id}', -1)"><i class="fas fa-minus"></i></button>
                                                      <span class="item-qty" id="qty-${extra.id}">0</span>
                                                      <button class="counter-btn" onclick="window.updateExtraQuantity('${extra.id}', 1)"><i class="fas fa-plus"></i></button>
                                                </div>
                                          </div>
                                          `).join('')}
                                    </div>
                                    ` : ''}
                                    ${product.hasDrinks && product.drinks && product.drinks.length > 0 ? `
                                    <div class="drink-group"><div style="font-weight:600; margin-bottom:4px;"><i class="fas fa-glass-cheers"></i> Choose your drink</div>
                                    <div class="drink-options">
                                          ${product.drinks.map((drink, i) => `<label class="drink-option ${i === 0 ? 'selected' : ''}"><input type="radio" name="drink" value="${typeof drink === 'string' ? drink : drink.name}" ${i === 0 ? 'checked' : ''}> <span class="drink-name">${typeof drink === 'string' ? drink : drink.name}</span></label>`).join('')}
                                    </div></div>
                                    ` : ''}
                                    <textarea class="special-instructions" id="specialInstructions" rows="3" placeholder="Add any special instructions..."></textarea>
                                    <div class="char-counter"><span id="charCount">0</span>/200 characters</div>
                              </div>
                              <div class="fixed-footer">
                                    <div class="global-counter">
                                          <button class="counter-btn" id="decrementMainBtn"><i class="fas fa-minus"></i></button>
                                          <span class="global-qty" id="mainQuantityValue">1</span>
                                          <button class="counter-btn" id="incrementMainBtn"><i class="fas fa-plus"></i></button>
                                    </div>
                                    <button class="modal-add-btn" id="addToCartBtn">Add · <span id="totalPriceValue">${(product.price || 0).toFixed(2)}</span> MAD</button>
                              </div>
                        </div>
                  `;
                  
                  const modalOverlay = document.getElementById('modalOverlay');
                  modalOverlay.innerHTML = modalHtml;
                  modalOverlay.style.display = 'flex';
                  document.body.style.overflow = 'hidden';
                  
                  // المتغيرات
                  let extraQuantities = {};
                  if (product.hasExtras && product.extras) { product.extras.forEach(extra => { extraQuantities[extra.id] = 0; }); }
                  let mainQuantity = 1;
                  let selectedFlavour = product.hasFlavours && product.flavours && product.flavours.length > 0 ? (typeof product.flavours[0] === 'string' ? product.flavours[0] : product.flavours[0].name) : "";
                  let selectedDrink = product.hasDrinks && product.drinks && product.drinks.length > 0 ? (typeof product.drinks[0] === 'string' ? product.drinks[0] : product.drinks[0].name) : "";
                  
                  // إغلاق المودال
                  document.getElementById('closeModalBtn').addEventListener('click', () => { modalOverlay.style.display = 'none'; document.body.style.overflow = 'auto'; modalOverlay.innerHTML = ''; });
                  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) { modalOverlay.style.display = 'none'; document.body.style.overflow = 'auto'; modalOverlay.innerHTML = ''; } });
                  
                  // شريط التمرير (Slider)
                  const slider = document.getElementById('flavourSlider');
                  if (slider) {
                        const leftDisplay = document.getElementById('leftQtyDisplay');
                        const rightDisplay = document.getElementById('rightQtyDisplay');
                        const track = document.getElementById('sliderTrack');
                        const total = product.totalPieces;
                        const updateSlider = (val) => {
                              const left = parseInt(val);
                              const right = total - left;
                              if (leftDisplay) leftDisplay.textContent = left;
                              if (rightDisplay) rightDisplay.textContent = right;
                              if (track) { const percent = (left / total) * 100; track.style.background = `linear-gradient(90deg, #e03131 0%, #e03131 ${percent}%, #fbbf24 ${percent}%, #fbbf24 100%)`; }
                        };
                        slider.addEventListener('input', (e) => updateSlider(e.target.value));
                        updateSlider(slider.value);
                  }
                  
                  // خيارات النكهات
                  document.querySelectorAll('.flavour-option').forEach(opt => {
                        opt.addEventListener('click', function() {
                              document.querySelectorAll('.flavour-option').forEach(o => o.classList.remove('active'));
                              this.classList.add('active');
                              selectedFlavour = this.getAttribute('data-flavour');
                        });
                  });
                  
                  // خيارات المشروبات
                  document.querySelectorAll('input[name="drink"]').forEach(radio => {
                        radio.addEventListener('change', function() { selectedDrink = this.value; });
                  });
                  
                  // عداد الأحرف
                  const specialInput = document.getElementById('specialInstructions');
                  const charSpan = document.getElementById('charCount');
                  if (specialInput) { specialInput.addEventListener('input', function() { charSpan.textContent = this.value.length; }); }
                  
                  // تحديث السعر الإجمالي
                  function updateTotalPrice() {
                        let total = (product.price || 0) * mainQuantity;
                        if (product.hasExtras && product.extras) { product.extras.forEach(extra => { total += (extra.price || 0) * (extraQuantities[extra.id] || 0); }); }
                        const priceSpan = document.getElementById('totalPriceValue');
                        if (priceSpan) priceSpan.textContent = total.toFixed(2);
                  }
                  
                  // أزرار الكمية الرئيسية
                  const decrementBtn = document.getElementById('decrementMainBtn');
                  const incrementBtn = document.getElementById('incrementMainBtn');
                  const quantitySpan = document.getElementById('mainQuantityValue');
                  if (decrementBtn) { decrementBtn.addEventListener('click', () => { if (mainQuantity > 1) { mainQuantity--; quantitySpan.textContent = mainQuantity; updateTotalPrice(); } }); }
                  if (incrementBtn) { incrementBtn.addEventListener('click', () => { mainQuantity++; quantitySpan.textContent = mainQuantity; updateTotalPrice(); }); }
                  
                  // دالة تحديث كمية الإضافات
                  window.updateExtraQuantity = function(extraId, delta) {
                        const newQty = (extraQuantities[extraId] || 0) + delta;
                        extraQuantities[extraId] = Math.max(0, newQty);
                        const qtySpan = document.getElementById(`qty-${extraId}`);
                        if (qtySpan) qtySpan.textContent = extraQuantities[extraId];
                        const extra = product.extras.find(e => e.id === extraId);
                        const subtotalSpan = document.getElementById(`subtotal-${extraId}`);
                        if (subtotalSpan && extra) { subtotalSpan.textContent = (extraQuantities[extraId] * extra.price).toFixed(2) + ' MAD'; }
                        updateTotalPrice();
                  };
                  
                  // زر الإضافة للسلة
                  const addBtn = document.getElementById('addToCartBtn');
                  if (addBtn) {
                        addBtn.addEventListener('click', () => {
                              const instructions = document.getElementById('specialInstructions')?.value || "";
                              const selectedExtras = {};
                              if (product.hasExtras && product.extras) {
                                    product.extras.forEach(extra => { if (extraQuantities[extra.id] > 0) { selectedExtras[extra.id] = { name: extra.name, quantity: extraQuantities[extra.id], price: extra.price }; } });
                              }
                              const customizations = {};
                              if (selectedFlavour) customizations.flavour = selectedFlavour;
                              if (selectedDrink) customizations.drink = selectedDrink;
                              if (Object.keys(selectedExtras).length > 0) customizations.extras = selectedExtras;
                              if (slider && product.flavours && product.flavours.length >= 2) {
                                    customizations.leftFlavour = product.flavours[0].name;
                                    customizations.rightFlavour = product.flavours[1].name;
                                    customizations.leftQty = parseInt(slider.value);
                                    customizations.rightQty = product.totalPieces - parseInt(slider.value);
                              }
                              addToCart(product, mainQuantity, customizations, instructions);
                              modalOverlay.style.display = 'none';
                              document.body.style.overflow = 'auto';
                              modalOverlay.innerHTML = '';
                        });
                  }
                  
                  updateTotalPrice();
            }

            // ==================== Event Listeners & Init ====================
            document.getElementById('backButton').addEventListener('click', () => { window.location.href = 'index.html'; });
            document.getElementById('viewCartBtn').addEventListener('click', () => { window.location.href = 'checkout.html'; });
            window.addEventListener('scroll', () => { const navbar = document.getElementById('navbar'); if (window.scrollY > 100) navbar.classList.add('scrolled'); else navbar.classList.remove('scrolled'); });
            
            window.closeModal = function() { document.getElementById('modalOverlay').style.display = 'none'; document.body.style.overflow = 'auto'; };
            
            setupSearch();
            setupShare();
            loadProducts();
      </script>
</body>

</html>
