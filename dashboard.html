<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>KFC Admin Dashboard | Full Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .admin-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area h1 {
            color: #8B0000;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area p {
            color: #666;
            font-size: 12px;
        }

        .stats-area {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 12px;
            opacity: 0.9;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .category-tab {
            padding: 12px 24px;
            background: #f0f0f0;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #333;
        }

        .category-tab:hover {
            transform: translateY(-2px);
            background: #8B0000;
            color: white;
        }

        .category-tab.active {
            background: linear-gradient(135deg, #8B0000, #cc0000);
            color: white;
            box-shadow: 0 4px 15px rgba(139,0,0,0.3);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-image-section {
            position: relative;
            height: 200px;
            background: #f5f5f5;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #8B0000;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 22px;
            font-weight: 800;
            color: #8B0000;
            margin: 10px 0;
        }

        .product-description {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .customizations-preview {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 12px;
        }

        .customizations-preview span {
            display: inline-block;
            background: #e0e0e0;
            padding: 3px 8px;
            border-radius: 12px;
            margin: 3px;
            font-size: 11px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-edit, .btn-delete {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-edit {
            background: #007bff;
            color: white;
        }

        .btn-edit:hover {
            background: #0056b3;
            transform: scale(1.02);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: scale(1.02);
        }

        .add-product-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .add-product-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40,167,69,0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #8B0000, #cc0000);
            color: white;
            padding: 20px;
            border-radius: 30px 30px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }

        .modal-header h3 {
            font-size: 22px;
        }

        .close-modal {
            background: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #8B0000;
            outline: none;
        }

        .customization-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .customization-section h4 {
            margin-bottom: 15px;
            color: #8B0000;
        }

        .extras-list, .drinks-list {
            margin-top: 10px;
        }

        .extra-item, .drink-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .extra-item input, .drink-item input {
            flex: 1;
            min-width: 120px;
        }

        .add-extra-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .remove-item {
            background: #dc3545;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-save, .btn-cancel {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 1100;
            animation: slideInRight 0.3s;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            .products-grid {
                grid-template-columns: 1fr;
            }
            .category-tab {
                font-size: 12px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="logo-area">
            <h1><i class="fas fa-fried-chicken"></i> KFC Admin Dashboard</h1>
            <p>Complete Menu Control System | Real-time Database</p>
        </div>
        <div class="stats-area" id="statsArea">
            <div class="stat-card">
                <div class="number" id="totalProducts">0</div>
                <div class="label">Total Products</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalCategories">7</div>
                <div class="label">Categories</div>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <button class="add-product-btn" onclick="openAddModal()">
            <i class="fas fa-plus-circle"></i> Add New Product
        </button>

        <div class="category-tabs" id="categoryTabs"></div>

        <div id="productsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading products from Firebase...</p>
            </div>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Product</h3>
                <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <input type="hidden" id="productCategory">
                    
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" required placeholder="e.g., Crispy Strips Meal">
                    </div>

                    <div class="form-group">
                        <label>Category *</label>
                        <select id="categorySelect" required onchange="updateCategoryField()">
                            <option value="">Select Category</option>
                            <option value="chickenMeals">🍗 CHICKEN MEALS</option>
                            <option value="hotWings">🔥 HOT WINGS</option>
                            <option value="loadedBuckets">🍗 LOADED BUCKETS</option>
                            <option value="comboMeals">🍔 COMBO MEALS</option>
                            <option value="familyBuckets">👨‍👩‍👧‍👦 FAMILY BUCKETS</option>
                            <option value="sides">🍟 SIDES</option>
                            <option value="drinks">🥤 DRINKS</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Price (MAD) *</label>
                        <input type="number" id="productPrice" step="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="productDescription" rows="3" placeholder="Describe the product..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="productImage" placeholder="https://...">
                        <small style="color: #999;">Leave empty for default image</small>
                    </div>

                    <div class="customization-section">
                        <h4><i class="fas fa-sliders-h"></i> Customization Options</h4>
                        
                        <div class="form-group">
                            <label><i class="fas fa-pepper-hot"></i> Has Flavour Selection?</label>
                            <select id="hasFlavours">
                                <option value="false">No</option>
                                <option value="true">Yes (Spicy/Original)</option>
                            </select>
                        </div>

                        <div id="flavoursSection" style="display: none;">
                            <div class="form-group">
                                <label>Flavour 1 Name</label>
                                <input type="text" id="flavour1Name" placeholder="e.g., Spicy" value="Spicy">
                                <label style="margin-top: 10px;">Flavour 1 Image URL</label>
                                <input type="url" id="flavour1Image" placeholder="https://...">
                            </div>
                            <div class="form-group">
                                <label>Flavour 2 Name</label>
                                <input type="text" id="flavour2Name" placeholder="e.g., Original" value="Original">
                                <label style="margin-top: 10px;">Flavour 2 Image URL</label>
                                <input type="url" id="flavour2Image" placeholder="https://...">
                            </div>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-glass-cheers"></i> Has Drink Selection?</label>
                            <select id="hasDrinks">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>

                        <div id="drinksSection" style="display: none;">
                            <div id="drinksList" class="drinks-list"></div>
                            <button type="button" class="add-extra-btn" onclick="addDrinkField()">+ Add Drink</button>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-plus-circle"></i> Has Extra Items?</label>
                            <select id="hasExtras">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>

                        <div id="extrasSection" style="display: none;">
                            <div id="extrasList" class="extras-list"></div>
                            <button type="button" class="add-extra-btn" onclick="addExtraField()">+ Add Extra Item</button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Product</button>
                        <button type="button" class="btn-cancel" onclick="closeModal()"><i class="fas fa-times"></i> Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ==================== Firebase Configuration (المعدل مع databaseURL الصحيح) ====================
        const firebaseConfig = {
            apiKey: "AIzaSyC7BQcsjKxZq0jATJ14wXoruOIa8NiIQsE",
            authDomain: "kfc-menu-dashboard.firebaseapp.com",
            databaseURL: "https://kfc-menu-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kfc-menu-dashboard",
            storageBucket: "kfc-menu-dashboard.firebasestorage.app",
            messagingSenderId: "465768808759",
            appId: "1:465768808759:web:d2ab65440b19008e465ab2",
            measurementId: "G-ZG8JM57DLC"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ==================== Global Variables ====================
        let currentCategory = 'chickenMeals';
        let allProducts = {
            chickenMeals: [],
            hotWings: [],
            loadedBuckets: [],
            comboMeals: [],
            familyBuckets: [],
            sides: [],
            drinks: []
        };
        
        const categoryNames = {
            chickenMeals: "🍗 CHICKEN MEALS",
            hotWings: "🔥 HOT WINGS",
            loadedBuckets: "🍗 LOADED BUCKETS",
            comboMeals: "🍔 COMBO MEALS",
            familyBuckets: "👨‍👩‍👧‍👦 FAMILY BUCKETS",
            sides: "🍟 SIDES",
            drinks: "🥤 DRINKS"
        };

        // ==================== Firebase Operations ====================
        function loadAllProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading products from Firebase...</p></div>';
            
            database.ref('products').once('value').then(snapshot => {
                const data = snapshot.val();
                if (data && Object.keys(data).length > 0) {
                    allProducts = data;
                } else {
                    await initializeDefaultProducts();
                }
                updateUI();
            }).catch(error => {
                console.error("Error loading products:", error);
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error: ${error.message}</h3><p>Check console for details</p></div>`;
                showToast("Error loading products: " + error.message, "error");
            });
        }

                ],
                hotWings: [
                    { id: "hw1", name: "Hot Wings (3 Pcs)", price: 30, description: "3 spicy crispy hot wings, perfectly seasoned and fried.", image: "https://i.ibb.co/93nQWQPX/IMG-5148.jpg", hasFlavours: false, hasDrinks: false, hasExtras: false, extras: [] }

                ],
                comboMeals: [
                    { id: "com1", name: "Mighty Zinger Combo", price: 86, description: "Double Zinger burger served with Fries, 1 Drink", image: "https://i.ibb.co/nsTffWCY/IMG-5132.png", hasFlavours: true, flavours: [{name:"Spicy",img:"https://i.ibb.co/ymmg8ywn/IMG-5106.png"},{name:"Original",img:"https://i.ibb.co/ymmg8ywn/IMG-5106.png"}], hasDrinks: true, drinks: [{name:"Pepsi",img:"https://i.ibb.co/YFfGKBJw/IMG-5155.webp"},{name:"7up",img:"https://i.ibb.co/SXf5ZJ03/IMG-5136.png"},{name:"Miranda",img:"https://i.ibb.co/Nndd5f05/IMG-5135.png"},{name:"Water",img:"https://i.ibb.co/SX48S52t/IMG-5133.png"}], hasExtras: true, extras: [{id:"bone",name:"Piece with bone",price:21,img:"https://i.ibb.co/TqLZtxwv/IMG-5113.png"},{id:"strips",name:"Chicken strips",price:15,img:"https://i.ibb.co/ymmg8ywn/IMG-5106.png"}] }
                ],
                familyBuckets: [
                    { id: "fb1", name: "Family Bucket 8 Pcs", price: 195, description: "8 pieces of chicken with bone served with 1 Family Fries, 1L Soft Drink, 3 Sauces and 1 Large Coleslaw.", image: "https://i.ibb.co/3mPYmS4H/IMG-5634.png", hasFlavours: true, flavours: [{name:"Spicy",img:"https://i.ibb.co/TqLZtxwv/IMG-5113.png"},{name:"Original",img:"https://i.ibb.co/TqLZtxwv/IMG-5113.png"}], hasDrinks: true, drinks: [{name:"Pepsi",img:"https://i.ibb.co/YFfGKBJw/IMG-5155.webp"},{name:"7up",img:"https://i.ibb.co/SXf5ZJ03/IMG-5136.png"},{name:"Miranda",img:"https://i.ibb.co/Nndd5f05/IMG-5135.png"},{name:"Water",img:"https://i.ibb.co/SX48S52t/IMG-5133.png"}], hasExtras: false, extras: [] }
                ],
                sides: [
                    { id: "sd1", name: "Rizo spicy", price: 55, description: "Spicy Rizo side", image: "https://i.ibb.co/gQrsPjN/IMG-5114.jpg", hasFlavours: false, hasDrinks: false, hasExtras: false, extras: [] },
                    { id: "sd2", name: "Medium Fries", price: 19, description: "Medium french fries", image: "https://i.ibb.co/0jPWcw0M/IMG-5111.png", hasFlavours: false, hasDrinks: false, hasExtras: false, extras: [] }
                ],
                drinks: [
                    { id: "dr1", name: "Pepsi", price: 11, description: "Pepsi cola", image: "https://i.ibb.co/YFfGKBJw/IMG-5155.webp", hasFlavours: false, hasDrinks: false, hasExtras: false, extras: [] },
                    { id: "dr2", name: "Water", price: 5, description: "Mineral water", image: "https://i.ibb.co/SX48S52t/IMG-5133.png", hasFlavours: false, hasDrinks: false, hasExtras: false, extras: [] }
                ]
            };
            
            return database.ref('products').set(defaultProducts).then(() => {
                allProducts = defaultProducts;
                showToast("Default products loaded successfully!", "success");
            });
        }

        function saveProduct(product, category, isEdit = false) {
            showToast("Saving product...", "info");
            
            database.ref(`products/${category}/${product.id}`).set(product).then(() => {
                if (!isEdit) {
                    if (!allProducts[category]) allProducts[category] = [];
                    allProducts[category].push(product);
                } else {
                    const index = allProducts[category].findIndex(p => p.id === product.id);
                    if (index !== -1) allProducts[category][index] = product;
                }
                updateUI();
                showToast(`✅ Product ${isEdit ? 'updated' : 'added'} successfully!`, "success");
                closeModal();
            }).catch(error => {
                console.error("Save error:", error);
                showToast("❌ Error: " + error.message, "error");
            });
        }

        function deleteProduct(category, productId) {
            if (confirm("Are you sure you want to delete this product?")) {
                database.ref(`products/${category}/${productId}`).remove().then(() => {
                    allProducts[category] = allProducts[category].filter(p => p.id !== productId);
                    updateUI();
                    showToast("✅ Product deleted successfully!", "success");
                }).catch(error => {
                    showToast("❌ Error: " + error.message, "error");
                });
            }
        }

        // ==================== UI Functions ====================
        function updateUI() {
            renderCategoryTabs();
            renderProducts();
            updateStats();
        }

        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = '';
            Object.keys(categoryNames).forEach(cat => {
                const count = allProducts[cat]?.length || 0;
                const tab = document.createElement('button');
                tab.className = `category-tab ${currentCategory === cat ? 'active' : ''}`;
                tab.innerHTML = `${categoryNames[cat]} <span style="background:rgba(0,0,0,0.1); padding:2px 8px; border-radius:20px; margin-left:8px;">${count}</span>`;
                tab.onclick = () => {
                    currentCategory = cat;
                    renderCategoryTabs();
                    renderProducts();
                };
                container.appendChild(tab);
            });
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            const products = allProducts[currentCategory] || [];
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>No Products in ${categoryNames[currentCategory]}</h3>
                        <p>Click "Add New Product" to get started!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="products-grid">
                    ${products.map(product => `
                        <div class="product-card">
                            <div class="product-image-section">
                                <img src="${product.image || 'https://via.placeholder.com/300x200/8B0000/white?text=KFC'}" class="product-image" onerror="this.src='https://via.placeholder.com/300x200/8B0000/white?text=No+Image'">
                                <div class="product-badge">${product.price} MAD</div>
                            </div>
                            <div class="product-info">
                                <h3 class="product-name">${escapeHtml(product.name)}</h3>
                                <div class="product-price">${product.price.toFixed(2)} MAD</div>
                                <p class="product-description">${escapeHtml(product.description?.substring(0, 100) || '')}${product.description?.length > 100 ? '...' : ''}</p>
                                ${product.hasFlavours ? '<div class="customizations-preview"><span><i class="fas fa-pepper-hot"></i> Flavours available</span></div>' : ''}
                                ${product.hasDrinks ? '<div class="customizations-preview"><span><i class="fas fa-glass-cheers"></i> Drinks included</span></div>' : ''}
                                ${product.hasExtras && product.extras?.length ? `<div class="customizations-preview"><span><i class="fas fa-plus-circle"></i> ${product.extras.length} extras</span></div>` : ''}
                                <div class="product-actions">
                                    <button class="btn-edit" onclick="openEditModal('${currentCategory}', '${product.id}')"><i class="fas fa-edit"></i> Edit</button>
                                    <button class="btn-delete" onclick="deleteProduct('${currentCategory}', '${product.id}')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function updateStats() {
            let total = 0;
            Object.keys(allProducts).forEach(cat => {
                total += (allProducts[cat]?.length || 0);
            });
            document.getElementById('totalProducts').textContent = total;
        }

        function updateCategoryField() {
            document.getElementById('productCategory').value = document.getElementById('categorySelect').value;
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('hasFlavours').value = 'false';
            document.getElementById('hasDrinks').value = 'false';
            document.getElementById('hasExtras').value = 'false';
            document.getElementById('flavoursSection').style.display = 'none';
            document.getElementById('drinksSection').style.display = 'none';
            document.getElementById('extrasSection').style.display = 'none';
            document.getElementById('drinksList').innerHTML = '';
            document.getElementById('extrasList').innerHTML = '';
            document.getElementById('productModal').style.display = 'flex';
            
            document.getElementById('hasFlavours').onchange = function() {
                document.getElementById('flavoursSection').style.display = this.value === 'true' ? 'block' : 'none';
            };
            document.getElementById('hasDrinks').onchange = function() {
                document.getElementById('drinksSection').style.display = this.value === 'true' ? 'block' : 'none';
            };
            document.getElementById('hasExtras').onchange = function() {
                document.getElementById('extrasSection').style.display = this.value === 'true' ? 'block' : 'none';
            };
        }

        function openEditModal(category, productId) {
            const product = allProducts[category].find(p => p.id === productId);
            if (!product) return;
            
            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productId').value = product.id;
            document.getElementById('productCategory').value = category;
            document.getElementById('productName').value = product.name;
            document.getElementById('categorySelect').value = category;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productImage').value = product.image || '';
            document.getElementById('hasFlavours').value = product.hasFlavours ? 'true' : 'false';
            document.getElementById('hasDrinks').value = product.hasDrinks ? 'true' : 'false';
            document.getElementById('hasExtras').value = product.hasExtras ? 'true' : 'false';
            
            if (product.hasFlavours && product.flavours) {
                document.getElementById('flavoursSection').style.display = 'block';
                document.getElementById('flavour1Name').value = product.flavours[0]?.name || '';
                document.getElementById('flavour1Image').value = product.flavours[0]?.img || '';
                document.getElementById('flavour2Name').value = product.flavours[1]?.name || '';
                document.getElementById('flavour2Image').value = product.flavours[1]?.img || '';
            } else {
                document.getElementById('flavoursSection').style.display = 'none';
            }
            
            if (product.hasDrinks && product.drinks) {
                document.getElementById('drinksSection').style.display = 'block';
                document.getElementById('drinksList').innerHTML = '';
                product.drinks.forEach((drink) => {
                    const div = document.createElement('div');
                    div.className = 'drink-item';
                    div.innerHTML = `
                        <input type="text" placeholder="Drink name" class="drink-name" value="${escapeHtml(drink.name || drink)}">
                        <input type="url" placeholder="Image URL" class="drink-img" value="${drink.img || ''}">
                        <button type="button" class="remove-item" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
                    `;
                    document.getElementById('drinksList').appendChild(div);
                });
            } else {
                document.getElementById('drinksSection').style.display = 'none';
            }
            
            if (product.hasExtras && product.extras) {
                document.getElementById('extrasSection').style.display = 'block';
                document.getElementById('extrasList').innerHTML = '';
                product.extras.forEach(extra => {
                    const div = document.createElement('div');
                    div.className = 'extra-item';
                    div.innerHTML = `
                        <input type="text" placeholder="Extra name" class="extra-name" value="${escapeHtml(extra.name)}">
                        <input type="number" placeholder="Price" class="extra-price" step="0.01" value="${extra.price}">
                        <input type="url" placeholder="Image URL" class="extra-img" value="${extra.img || ''}">
                        <button type="button" class="remove-item" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
                    `;
                    document.getElementById('extrasList').appendChild(div);
                });
            } else {
                document.getElementById('extrasSection').style.display = 'none';
            }
            
            document.getElementById('hasFlavours').onchange = function() {
                document.getElementById('flavoursSection').style.display = this.value === 'true' ? 'block' : 'none';
            };
            document.getElementById('hasDrinks').onchange = function() {
                document.getElementById('drinksSection').style.display = this.value === 'true' ? 'block' : 'none';
            };
            document.getElementById('hasExtras').onchange = function() {
                document.getElementById('extrasSection').style.display = this.value === 'true' ? 'block' : 'none';
            };
            
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addDrinkField() {
            const div = document.createElement('div');
            div.className = 'drink-item';
            div.innerHTML = `
                <input type="text" placeholder="Drink name" class="drink-name">
                <input type="url" placeholder="Image URL" class="drink-img">
                <button type="button" class="remove-item" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            document.getElementById('drinksList').appendChild(div);
        }

        function addExtraField() {
            const div = document.createElement('div');
            div.className = 'extra-item';
            div.innerHTML = `
                <input type="text" placeholder="Extra name" class="extra-name">
                <input type="number" placeholder="Price" class="extra-price" step="0.01">
                <input type="url" placeholder="Image URL" class="extra-img">
                <button type="button" class="remove-item" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            document.getElementById('extrasList').appendChild(div);
        }

        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const category = document.getElementById('categorySelect').value;
            if (!category) {
                showToast("Please select a category", "error");
                return;
            }
            
            const productId = document.getElementById('productId').value || Date.now().toString();
            
            let flavours = [];
            if (document.getElementById('hasFlavours').value === 'true') {
                flavours = [
                    { name: document.getElementById('flavour1Name').value || "Spicy", img: document.getElementById('flavour1Image').value || "" },
                    { name: document.getElementById('flavour2Name').value || "Original", img: document.getElementById('flavour2Image').value || "" }
                ];
            }
            
            let drinks = [];
            if (document.getElementById('hasDrinks').value === 'true') {
                document.querySelectorAll('#drinksList .drink-item').forEach(item => {
                    const name = item.querySelector('.drink-name')?.value;
                    if (name) {
                        drinks.push({ name: name, img: item.querySelector('.drink-img')?.value || "" });
                    }
                });
            }
            
            let extras = [];
            if (document.getElementById('hasExtras').value === 'true') {
                document.querySelectorAll('#extrasList .extra-item').forEach((item, index) => {
                    const name = item.querySelector('.extra-name')?.value;
                    const price = parseFloat(item.querySelector('.extra-price')?.value);
                    if (name && !isNaN(price)) {
                        extras.push({
                            id: `extra_${Date.now()}_${index}`,
                            name: name,
                            price: price,
                            img: item.querySelector('.extra-img')?.value || ""
                        });
                    }
                });
            }
            
            const product = {
                id: productId,
                name: document.getElementById('productName').value,
                price: parseFloat(document.getElementById('productPrice').value),
                description: document.getElementById('productDescription').value,
                image: document.getElementById('productImage').value || 'https://via.placeholder.com/300x200/8B0000/white?text=KFC',
                hasFlavours: document.getElementById('hasFlavours').value === 'true',
                hasDrinks: document.getElementById('hasDrinks').value === 'true',
                hasExtras: document.getElementById('hasExtras').value === 'true',
                flavours: flavours,
                drinks: drinks,
                extras: extras
            };
            
            const isEdit = !!document.getElementById('productId').value;
            saveProduct(product, category, isEdit);
        });

        function showToast(message, type = "success") {
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            toast.style.background = type === 'success' ? '#28a745' : (type === 'error' ? '#dc3545' : '#17a2b8');
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Make functions global
        window.openAddModal = openAddModal;
        window.openEditModal = openEditModal;
        window.deleteProduct = deleteProduct;
        window.closeModal = closeModal;
        window.addDrinkField = addDrinkField;
        window.addExtraField = addExtraField;
        window.updateCategoryField = updateCategoryField;

        // Initialize
        loadAllProducts();


        // Make sure functions are global
window.openAddModal = openAddModal;
window.closeModal = closeModal;
window.addDrinkField = addDrinkField;
window.addExtraField = addExtraField;
window.updateCategoryField = updateCategoryField;
window.openEditModal = openEditModal;
window.deleteProduct = deleteProduct;
    </script>
